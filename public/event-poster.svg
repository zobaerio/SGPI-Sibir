<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">নবীন বরণ ২০২৬</title><desc id="desc">সাতক্ষীরা সরকারি পলিটেকনিক ইনস্টিটিউট, ১২ নভেম্বর ২০২৬, সাতক্ষীরা শহর।</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ff3f"/><stop offset=".42" stop-color="#a7f35b"/><stop offset="1" stop-color="#efffe9"/></linearGradient>
 <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53e52c"/><stop offset="1" stop-color="#31cf46"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#164e24" flood-opacity=".16"/></filter>
</defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<circle cx="50" cy="20" r="330" fill="#c8ff18" opacity=".48"/><circle cx="1030" cy="60" r="300" fill="#38d94c" opacity=".28"/>
<path d="M0 310 Q300 190 550 310 T1080 260 V530 H0Z" fill="#fff" opacity=".38"/>
<text x="540" y="130" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="40" font-weight="700" fill="#7f1d1d">সাতক্ষীরা সরকারি পলিটেকনিক ইনস্টিটিউটের</text>
<text x="540" y="190" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="38" font-weight="700" fill="#7f1d1d">২০২৫-২০২৬ শিক্ষাবর্ষের প্রথম সেমিস্টারের</text>
<text x="540" y="245" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="38" font-weight="700" fill="#7f1d1d">নবীন শিক্ষার্থীদের নিয়ে</text>
<text x="540" y="420" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="138" font-weight="900" fill="#252b83">নবীন বরণ</text>
<text x="540" y="550" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="130" font-weight="900" fill="#252b83">২০২৬</text>
<rect x="75" y="625" width="930" height="350" rx="34" fill="#fff" opacity=".94" filter="url(#shadow)"/>
<g font-family="'Noto Sans Bengali',sans-serif" font-weight="800">
 <text x="140" y="720" font-size="43" fill="#991b1b">১২ নভেম্বর ২০২৬</text>
 <text x="140" y="790" font-size="40" fill="#14532d">রোজ বৃহস্পতিবার</text>
 <text x="140" y="870" font-size="34" fill="#14532d">সাতক্ষীরা সরকারি পলিটেকনিক</text>
 <text x="140" y="920" font-size="34" fill="#14532d">ইনস্টিটিউট, সাতক্ষীরা শহর</text>
 <text x="540" y="1050" text-anchor="middle" font-size="58" fill="#831843">থাকছে একগুচ্ছ উপহার।</text>
 <text x="540" y="1120" text-anchor="middle" font-size="32" fill="#14532d">রেজিস্ট্রেশন সম্পূর্ণ ফ্রি</text>
</g>
<rect y="1160" width="1080" height="190" fill="url(#foot)"/>
<text x="540" y="1235" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="44" font-weight="900" fill="#252b83">বাংলাদেশ ইসলামী ছাত্রশিবির</text>
<text x="540" y="1290" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="36" font-weight="800" fill="#7f1d1d">সাতক্ষীরা সরকারি পলিটেকনিক ইনস্টিটিউট</text>
<text x="540" y="1330" text-anchor="middle" font-family="'Noto Sans Bengali',sans-serif" font-size="29" font-weight="800" fill="#252b83">সাতক্ষীরা শহর</text>
</svg>